{% if page_obj.has_other_pages %}
<nav class="pagination-bar" aria-label="Page navigation">
    {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}" class="btn btn-outline" aria-label="Previous page">&#8592; Previous</a>
    {% else %}
    <span class="btn btn-outline pagination-disabled" aria-disabled="true">&#8592; Previous</span>
    {% endif %}

    <span class="pagination-info">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}" class="btn btn-outline" aria-label="Next page">Next &#8594;</a>
    {% else %}
    <span class="btn btn-outline pagination-disabled" aria-disabled="true">Next &#8594;</span>
    {% endif %}
</nav>
{% endif %}
