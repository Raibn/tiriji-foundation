name: Keep tirijifoundation.org Service Awake

on:
  schedule:
    # Everyday 8mins 24/7 
    - cron: '*/8 * * * *'
  workflow_dispatch:   # allows manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl -sf https://tirijifoundation.onrender.com/ \
            || echo "service starting up"
